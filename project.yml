name: VoiceComputerPOC
options:
  bundleIdPrefix: com.neonwatty
targets:
  VoiceComputerPOC:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - VoiceComputerPOC
      - path: evals/router-instruction.txt
        buildPhase: resources
      - path: evals/router-cli-args.json
        buildPhase: resources
      - path: evals/router-output.schema.json
        buildPhase: resources
    postBuildScripts:
      - name: Package pinned DesktopToolServer
        script: '"$SRCROOT/scripts/package-desktop-tool.sh"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neonwatty.VoiceComputerPOC
        PRODUCT_NAME: VoiceComputerPOC
        SWIFT_VERSION: 5.0
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Voice Computer POC
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Voice Computer POC records a spoken command for local transcription."
  VoiceComputerPOCTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - VoiceComputerPOCTests
    dependencies:
      - target: VoiceComputerPOC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neonwatty.VoiceComputerPOCTests
        SWIFT_VERSION: 5.0
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES
