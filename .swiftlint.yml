included:
  - VoiceComputerPOC
  - VoiceComputerPOCTests

# swift-format owns whitespace and layout. SwiftLint checks structural limits.
only_rules:
  - cyclomatic_complexity
  - file_length
  - force_cast
  - force_try
  - function_body_length

file_length:
  warning: 300
  error: 300

function_body_length:
  warning: 60
  error: 60

cyclomatic_complexity:
  warning: 15
  error: 15
