name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned XcodeGen
        run: |
          binary="$(scripts/install-xcodegen.sh | tail -1)"
          echo "XCODEGEN_BIN=$binary" >> "$GITHUB_ENV"
      - name: Check generated Xcode project
        run: |
          "$XCODEGEN_BIN" generate --spec project.yml
          git diff --exit-code -- VoiceComputerPOC.xcodeproj
      - name: Check Swift formatting
        run: xcrun swift-format lint --strict --recursive VoiceComputerPOC VoiceComputerPOCTests
      - name: Validate smoke driver
        run: python3 -m py_compile scripts/smoke_app_server.py
      - name: Build and run unit tests
        run: |
          xcodebuild -quiet \
            -project VoiceComputerPOC.xcodeproj \
            -scheme VoiceComputerPOC \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            test CODE_SIGNING_ALLOWED=NO
