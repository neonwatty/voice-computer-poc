name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned XcodeGen
        run: |
          binary="$(scripts/install-xcodegen.sh | tail -1)"
          echo "XCODEGEN_BIN=$binary" >> "$GITHUB_ENV"
      - name: Check generated Xcode project
        run: |
          "$XCODEGEN_BIN" generate --spec project.yml
          git diff --exit-code -- VoiceComputerPOC.xcodeproj
      - name: Check Swift formatting
        run: xcrun swift-format lint --strict --recursive VoiceComputerPOC VoiceComputerPOCTests DesktopToolServer
      - name: Check Swift source limits
        run: |
          python3 scripts/check-swift-file-length.py
          binary="$(scripts/install-quality-tool.sh swiftlint)"
          "$binary" lint --strict --no-cache
      - name: Validate smoke driver
        run: python3 -m py_compile scripts/smoke_app_server.py scripts/check-swift-file-length.py
      - name: Test Swift MCP tool
        run: swift test --package-path DesktopToolServer
      - name: Build and run unit tests
        run: |
          xcodebuild -quiet \
            -project VoiceComputerPOC.xcodeproj \
            -scheme VoiceComputerPOC \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            test CODE_SIGNING_ALLOWED=NO
      - name: Check for unused Swift code
        run: |
          binary="$(scripts/install-quality-tool.sh periphery)"
          "$binary" scan \
            --project VoiceComputerPOC.xcodeproj \
            --schemes VoiceComputerPOC \
            --skip-build \
            --index-store-path DerivedData/Index.noindex/DataStore \
            --strict \
            --disable-update-check
