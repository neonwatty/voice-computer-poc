name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned XcodeGen
        run: |
          binary="$(scripts/install-xcodegen.sh | tail -1)"
          echo "XCODEGEN_BIN=$binary" >> "$GITHUB_ENV"
      - name: Check generated Xcode project
        run: |
          "$XCODEGEN_BIN" generate --spec project.yml
          git diff --exit-code -- VoiceComputerPOC.xcodeproj
      - name: Check Swift formatting
        run: xcrun swift-format lint --strict --recursive VoiceComputerPOC VoiceComputerPOCTests DesktopToolServer
      - name: Check Swift source limits
        run: |
          python3 scripts/check-swift-file-length.py
          binary="$(scripts/install-quality-tool.sh swiftlint)"
          "$binary" lint --strict --no-cache
      - name: Validate smoke driver
        run: |
          python3 -m py_compile scripts/smoke_app_server.py scripts/test_smoke_app_server.py scripts/browser_fixture.py scripts/test_browser_fixture.py scripts/probe_codex_status.py scripts/test_probe_codex_status.py scripts/eval-router.py scripts/check-swift-file-length.py scripts/run_desktop_suite.py scripts/test_run_desktop_suite.py scripts/run_reviewed_desktop_suite.py scripts/test_run_reviewed_desktop_suite.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
          swiftc -typecheck scripts/observe_safari_windows.swift
          swiftc -typecheck scripts/observe_finder_windows.swift
          swiftc -typecheck scripts/observe_textedit_windows.swift
      - name: Test Swift MCP tool
        run: swift test --package-path DesktopToolServer
      - name: Build and run unit tests
        id: debug_tests
        run: |
          xcodebuild -quiet \
            -project VoiceComputerPOC.xcodeproj \
            -scheme VoiceComputerPOC \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/VoiceComputerPOC-Debug.xcresult" \
            test CODE_SIGNING_ALLOWED=NO
      - name: Save failed Debug XCTest results
        if: ${{ failure() && steps.debug_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debug-xcresult
          path: ${{ runner.temp }}/VoiceComputerPOC-Debug.xcresult
          if-no-files-found: error
      - name: Verify bundled Debug desktop helper
        run: |
          helper="DerivedData/Build/Products/Debug/VoiceComputerPOC.app/Contents/Helpers/DesktopToolServer"
          source="DerivedData/Build/Intermediates.noindex/VoiceComputerPOC.build/Debug/VoiceComputerPOC.build/DerivedSources/DesktopToolServer-Debug"
          product="$source/out/Products/Debug/DesktopToolServer"
          if test ! -f "$product"; then product="$source/debug/DesktopToolServer"; fi
          test -f "$helper" && test -x "$helper" && test ! -L "$helper"
          test -f "$product"
          cmp "$product" "$helper"
          test "$(shasum -a 256 "$helper" | awk '{print $1}')" = "$(cat "$helper.sha256")"
      - name: Run Release unit tests
        id: release_tests
        run: |
          xcodebuild -quiet \
            -project VoiceComputerPOC.xcodeproj \
            -scheme VoiceComputerPOC \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/VoiceComputerPOC-Release.xcresult" \
            test CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES
      - name: Save failed Release XCTest results
        if: ${{ failure() && steps.release_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-xcresult
          path: ${{ runner.temp }}/VoiceComputerPOC-Release.xcresult
          if-no-files-found: error
      - name: Verify bundled Release desktop helper
        run: |
          helper="DerivedData/Build/Products/Release/VoiceComputerPOC.app/Contents/Helpers/DesktopToolServer"
          source="DerivedData/Build/Intermediates.noindex/VoiceComputerPOC.build/Release/VoiceComputerPOC.build/DerivedSources/DesktopToolServer-Release"
          product="$source/out/Products/Release/DesktopToolServer"
          if test ! -f "$product"; then product="$source/release/DesktopToolServer"; fi
          test -f "$helper" && test -x "$helper" && test ! -L "$helper"
          test -f "$product"
          cmp "$product" "$helper"
          test "$(shasum -a 256 "$helper" | awk '{print $1}')" = "$(cat "$helper.sha256")"
      - name: Check for unused Swift code
        run: |
          binary="$(scripts/install-quality-tool.sh periphery)"
          "$binary" scan \
            --project VoiceComputerPOC.xcodeproj \
            --schemes VoiceComputerPOC \
            --skip-build \
            --index-store-path DerivedData/Index.noindex/DataStore \
            --strict \
            --disable-update-check
